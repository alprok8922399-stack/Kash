<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Приватная комната</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="header-panel">
        <h2>Приватная комната</h2>
        <div class="control-buttons">
            <button class="btn btn-zoom" onclick="zoomIn()">➕ Приблизить</button>
            <button class="btn btn-zoom" onclick="zoomOut()">➖ Отдалить</button>
            <button class="btn btn-zoom" onclick="resetView()">🎯 В центр</button>
            <button class="btn btn-reset" onclick="resetTree()">🔄 Сброс дерева</button>
        </div>
    </div>

    <div id="viewport">
        <div id="pan-container">
            <div class="tree-container">
                <div id="tree"></div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
