<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Приватная структура бинара</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f4f7f6;
            overflow: hidden; /* Отключаем стандартные скроллы браузера */
            user-select: none;
        }
        /* Панель управления кнопками сверху */
        .control-panel {
            position: fixed;
            top: 15px;
            left: 15px;
            z-index: 1000;
            background: white;
            padding: 10px 15px;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.15);
            display: flex;
            gap: 10px;
            align-items: center;
        }
        .btn {
            padding: 8px 14px;
            border: none;
            border-radius: 4px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
        }
        .btn-reset { background-color: #dc3545; color: white; }
        .btn-reset:hover { background-color: #bd2130; }
        .btn-zoom { background-color: #007bff; color: white; }
        .btn-zoom:hover { background-color: #0069d9; }
        
        /* Бесконечная рабочая область для перетаскивания */
        #viewport {
            width: 100vw;
            height: 100vh;
            cursor: grab;
            position: relative;
        }
        #viewport:active { cursor: grabbing; }

        /* Сам контейнер дерева, который масштабируется и двигается скриптом */
        #pan-container {
            position: absolute;
            transform-origin: 0 0; /* Точка масштабирования сверху слева */
            padding: 150px; /* Запас для центрирования */
            display: inline-block;
        }

        /* Отрисовка структуры */
        .children {
            display: flex;
            justify-content: center;
            margin-top: 25px;
            gap: 15px;
        }
        .branch {
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .node {
            padding: 10px 15px;
            border-radius: 6px;
            min-width: 80px;
            text-align: center;
            box-shadow: 0 3px 6px rgba(0,0,0,0.1);
            font-size: 13px;
            border: 1px solid rgba(0,0,0,0.1);
            background: white;
        }
        .level-1 { background-color: #ffc107; color: #333; }
        .level-2 { background-color: #28a745; color: white; }
        .level-3 { background-color: #17a2b8; color: white; }
        .empty {
            background-color: transparent;
            border: 2px dashed #bbb;
            color: #999;
            box-shadow: none;
        }
        .id-tag {
            font-size: 10px;
            display: block;
            margin-top: 4px;
            opacity: 0.7;
        }
    </style>
</head>
<body>

    <div class="control-panel">
        <button class="btn btn-reset" onclick="resetTree()">🔄 Вернуть всё в начало</button>
        <button class="btn btn-zoom" onclick="zoomIn()">➕</button>
        <button class="btn btn-zoom" onclick="zoomOut()">➖</button>
        <button class="btn btn-zoom" onclick="resetView()">🎯 Центр</button>
    </div>

    <div id="viewport">
        <div id="pan-container">
            <div id="tree"></div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
