<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Бинарная структура</title>
    <style>
        body { font-family: sans-serif; text-align: center; }
        .node { border: 2px solid #333; padding: 15px; margin: 10px; display: inline-block; border-radius: 8px; }
    </style>
</head>
<body>
    <h1>Структура бинарного маркетинга</h1>
    <div id="tree">Загрузка данных...</div>

    <script>
        fetch('/data.json')
            .then(response => response.json())
            .then(data => {
                document.getElementById('tree').innerHTML = `
                    <div class="node">Логин: ${data.login}</div>
                    <div>
                        <div class="node">Лево: ${data.left ? data.left.login : 'Пусто'}</div>
                        <div class="node">Право: ${data.right ? data.right.login : 'Пусто'}</div>
                    </div>
                `;
            });
    </script>
</body>
</html>
