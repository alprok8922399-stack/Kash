<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Авто-Регистрация в бинар</title>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; padding-top: 50px; background: #f4f4f9; color: #333; }
        .container { max-width: 500px; margin: 0 auto; background: white; padding: 30px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        .status-box { background: #e9ecef; padding: 15px; border-radius: 5px; min-height: 50px; font-weight: bold; margin-bottom: 20px; }
        .log-box { text-align: left; max-height: 250px; overflow-y: auto; background: #212529; color: #00ff00; padding: 15px; border-radius: 5px; font-family: monospace; font-size: 14px; }
    </style>
</head>
<body>
    <div class="container">
        <h2>Регистратор-Автомат 🤖</h2>
        <p style="color: #666;">Регистрация пользователей каждые 3 секунды по Правилу Четырёх</p>
        <div class="status-box" id="currentAction">Запуск автомата...</div>
        <h3>Лог отправки:</h3>
        <div class="log-box" id="logConsole"></div>
    </div>

    <script>
        let userCounter = 1;
        const logConsole = document.getElementById('logConsole');
        const currentAction = document.getElementById('currentAction');

        function addLog(message, isSuccess = true) {
            const time = new Date().toLocaleTimeString();
            const color = isSuccess ? '#00ff00' : '#ff3333';
            logConsole.innerHTML = `<div style="color: ${color}">[${time}] ${message}</div>` + logConsole.innerHTML;
        }

        function getLetterByLevel(level) {
            if (level === 1) return "Admin";
            return String.fromCharCode(65 + level - 2);
        }

        function findNodeById(root, id) {
            if (!root) return null;
            if (root.id === id) return root;
            return findNodeById(root.left, id) || findNodeById(root.right, id);
        }

        // Генерирует шахматную/веерную последовательность номеров для уровня
        function getChessSequenceForLevel(level) {
            const maxNodes = Math.pow(2, level - 1);
            const sequence = [];
            const totalQuads = maxNodes / 4; 
            for (let position = 0; position < 4; position++) {
                for (let quadIndex = 0; quadIndex < totalQuads; quadIndex++) {
                    const nodeNumber = (quadIndex * 4) + position + 1;
                    sequence.push(nodeNumber);
                }
            }
            return sequence;
        }

        // Функция автоматического определения следующего свободного ID по веерной системе
        function getNextTargetId(root) {
            // Начинаем поиск с уровня 3 (Уровень C), так как уровни 1 и 2 предустановлены (Admin, A1, A2)
            let level = 3;
            while (level <= 7) {
                const letter = getLetterByLevel(level);
                const sequence = getChessSequenceForLevel(level);
                
                for (let i = 0; i < sequence.length; i++) {
                    const cellId = `${letter}${sequence[i]}`;
                    // Если такого ID в дереве ещё нет — это наша цель!
                    if (!findNodeById(root, cellId)) {
                        return cellId;
                    }
                }
                level++;
            }
            return null;
        }

        function autoRegister() {
            // Сначала запрашиваем актуальное дерево, чтобы точно знать куда ставить
            fetch('/api/tree')
            .then(res => res.json())
            .then(treeData => {
                const root = treeData.tree ? treeData.tree : treeData;
                const targetId = getNextTargetId(root);

                if (!targetId) {
                    addLog("Структура полностью заполнена до 7 уровня!", false);
                    return;
                }

                const robotLogin = `User_${userCounter}`;
                currentAction.innerText = `Отправка: ${robotLogin} в ячейку ${targetId}`;

                // Шлем запрос с указанием targetId, как требует новый index.js
                return fetch('/api/register', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ login: robotLogin, targetId: targetId })
                })
                .then(res => res.json())
                .then(data => {
                    if(data.success) {
                        addLog(`Успешно: "${robotLogin}" ➡️ ячейка ${targetId}`, true);
                        userCounter++;
                    } else {
                        addLog(`Ошибка сервера: ${data.message || 'Занято'}`, false);
                    }
                });
            })
            .catch(err => {
                addLog(`Ошибка сети с сервером`, false);
            });
        }

        // Интервал проверки сброса структуры (синхронизация счетчика)
        setInterval(() => {
            fetch('/api/tree')
            .then(res => res.json())
            .then(treeData => {
                const root = treeData.tree ? treeData.tree : treeData;
                // Если остался только админ и стартовые узлы, сбрасываем счетчик
                if (root && root.left && !root.left.left && !root.left.right) {
                    if (userCounter !== 1) {
                        userCounter = 1;
                        addLog(`Обнаружен сброс структуры! Начинаем с User_1 🔄`, true);
                    }
                }
            })
            .catch(err => console.error(err));
        }, 3000);

        // Запуск авторегистрации каждые 3 секунды
        setInterval(autoRegister, 3000);
    </script>
</body>
</html>
