<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Авто-Регистрация в бинар</title>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; padding-top: 50px; background: #f4f4f9; color: #333; }
        .container { max-width: 500px; margin: 0 auto; background: white; padding: 30px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        .status-box { background: #e9ecef; padding: 15px; border-radius: 5px; min-height: 50px; font-weight: bold; margin-bottom: 20px; }
        .log-box { text-align: left; max-height: 250px; overflow-y: auto; background: #212529; color: #00ff00; padding: 15px; border-radius: 5px; font-family: monospace; font-size: 14px; }
        .badge { background: #007bff; color: white; padding: 5px 10px; border-radius: 20px; font-size: 12px; }
    </style>
</head>
<body>
    <div class="container">
        <h2>Регистратор-Автомат 🤖</h2>
        <p style="color: #666;">Генерирует и регистрирует пользователей каждую 1 секунду</p>
        
        <div class="status-box" id="currentAction">Регистрация запущена...</div>
        
        <h3>Лог отправки:</h3>
        <div class="log-box" id="logConsole"></div>
    </div>

    <script>
        let userCounter = 1;
        const logConsole = document.getElementById('logConsole');
        const currentAction = document.getElementById('currentAction');

        function addLog(message, isSuccess = true) {
            const time = new Date().toLocaleTimeString();
            const color = isSuccess ? '#00ff00' : '#ff3333';
            logConsole.innerHTML = `<div style="color: ${color}">[${time}] ${message}</div>` + logConsole.innerHTML;
        }

        function autoRegister() {
            const robotLogin = `User_${userCounter}`;
            currentAction.innerText = `Отправка: ${robotLogin}`;

            fetch('/api/register', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ login: robotLogin })
            })
            .then(res => res.json())
            .then(data => {
                if(data.success) {
                    addLog(`Успешно зарегистрирован "${robotLogin}" ➡️ ячейка ${data.id}`, true);
                    userCounter++;
                } else {
                    addLog(`Ошибка сервера: ${data.message}`, false);
                }
            })
            .catch(err => {
                addLog(`Ошибка сети с kash-04dt.onrender.com`, false);
            });
        }

        // Каждые 2 секунды проверяем, не сбросил ли админ дерево, чтобы обнулить счетчик роботов
        setInterval(() => {
            fetch('/api/tree')
            .then(res => res.json())
            .then(apiData => {
                if (apiData.currentLevel === 3 && apiData.registeredInCurrentLevel.length === 0) {
                    if (userCounter !== 1) {
                        userCounter = 1; // Сбрасываем счетчик имен роботов назад к единице
                        addLog(`Обнаружен сброс структуры на сервере! Начинаем с User_1 🔄`, true);
                    }
                }
            })
            .catch(err => console.error("Ошибка синхронизации счетчика:", err));
        }, 2000);

        // Запуск генерации пользователей каждую секунду
        setInterval(autoRegister, 1000);
    </script>
</body>
</html>
