<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Регистрация в бинар</title>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; padding-top: 50px; background: #f4f4f9; }
        input { padding: 10px; width: 200px; font-size: 16px; border: 1px solid #ccc; border-radius: 5px; }
        button { padding: 10px 20px; font-size: 16px; background: #28a745; color: white; border: none; border-radius: 5px; cursor: pointer; margin-left: 10px; }
    </style>
</head>
<body>
    <h2>Введи свой логин для входа в матрицу:</h2>
    <input type="text" id="userLogin" placeholder="Твой логин..." required>
    <button onclick="sendRegistration()">Залететь</button>

    <p id="status" style="margin-top: 20px; font-weight: bold;"></p>

    <script>
        function sendRegistration() {
            const login = document.getElementById('userLogin').value.trim();
            const status = document.getElementById('status');
            if(!login) return alert('Введите логин!');

            status.innerText = "Отправка...";
            
            // Шлем запрос на наш сервер
            fetch('/api/register', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ login: login })
            })
            .then(res => res.json())
            .then(data => {
                if(data.success) {
                    status.style.color = "green";
                    status.innerText = `Успешно! Ты встал на место: ${data.id}`;
                    document.getElementById('userLogin').value = '';
                } else {
                    status.style.color = "red";
                    status.innerText = "Ошибка: " + data.message;
                }
            })
            .catch(err => {
                status.style.color = "red";
                status.innerText = "Ошибка соединения с сервером";
            });
        }
    </script>
</body>
</html>
